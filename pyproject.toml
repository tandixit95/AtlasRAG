[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "atlasrag"
version = "0.3.0.dev0"
description = "A reconstruction-first RAG systems lab focused on retrieval quality, provenance, permissions, and reproducible evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Tanmay Dixit"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["rag", "information-retrieval", "bm25", "hybrid-search", "evaluation"]
dependencies = []

[project.urls]
Repository = "https://github.com/tandixit95/AtlasRAG"
Issues = "https://github.com/tandixit95/AtlasRAG/issues"
Changelog = "https://github.com/tandixit95/AtlasRAG/blob/main/CHANGELOG.md"
"Benchmark evidence" = "https://github.com/tandixit95/AtlasRAG/tree/main/benchmarks"

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3,<6",
]
reranking = [
    "sentence-transformers>=3,<6",
]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "."]
testpaths = ["tests", "benchmarks/scale/tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/src/*.py" = ["E501"]
